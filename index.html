
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0b10">
<title>MDUY MODZ - Access</title>

<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #0a0b10;
    --cyan: #00e5ff;
    --sub: #8b92a5;
    --red: #ff4b4b;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Chakra Petch', sans-serif;
    -webkit-tap-highlight-color: transparent;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
    position: relative;
}

body::before {
    content: "";
    position: fixed;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: rgba(0,229,255,.07);
    filter: blur(100px);
    top: 15%;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
}

.container {
    width: 100%;
    max-width: 400px;
    position: relative;
    z-index: 1;
    animation: appear .6s ease both;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

.lang-btn {
    position: absolute;
    right: 0;
    top: 0;
    padding: 8px 12px;
    color: var(--sub);
    background: #ffffff08;
    border: 1px solid #ffffff1a;
    border-radius: 4px;
    font-size: 12px;
}

.logo-container {
    text-align: center;
    margin-bottom: 28px;
}

.logo-text {
    font-size: 54px;
    font-weight: 700;
    font-style: italic;
    line-height: 1;
    text-shadow: 0 0 25px #00e5ff66;
}

.logo-sub {
    display: inline-block;
    color: var(--cyan);
    font-size: 22px;
    letter-spacing: 7px;
    margin-top: 8px;
}

.slogan {
    text-align: center;
    color: var(--sub);
    font-size: 10px;
    letter-spacing: 1.5px;
    margin-bottom: 42px;
}

.input-group {
    margin-bottom: 18px;
}

.input-label {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--cyan);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 10px;
}

.input-label::before {
    content: "";
    width: 7px;
    height: 7px;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
}

.key-wrapper {
    display: flex;
    background: #11131a;
    border: 1px solid #00e5ff88;
    border-radius: 5px;
    overflow: hidden;
    transition: .2s;
}

.key-wrapper:focus-within {
    border-color: var(--cyan);
    box-shadow: 0 0 18px #00e5ff20;
}

.key-wrapper input {
    width: 100%;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    padding: 18px 12px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.key-wrapper input::placeholder {
    color: #555d70;
    font-size: 12px;
}

.paste-btn {
    flex-shrink: 0;
    padding: 0 17px;
    background: #1a1c23;
    color: white;
    border: none;
    border-left: 1px solid #333;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
}

.unlock-btn {
    width: 100%;
    padding: 18px;
    background: var(--cyan);
    color: #000;
    border: none;
    border-radius: 4px;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    transition: .2s;
    margin-bottom: 18px;
}

.unlock-btn:active {
    transform: scale(.98);
}

.unlock-btn:disabled {
    opacity: .6;
    cursor: wait;
}

.status {
    min-height: 22px;
    text-align: center;
    font-size: 12px;
    color: var(--cyan);
    margin-bottom: 18px;
    overflow-wrap: anywhere;
}

.status.error {
    color: var(--red);
}

.footer {
    text-align: center;
    color: var(--sub);
    font-size: 12px;
    line-height: 2;
}

.footer a {
    color: var(--cyan);
    text-decoration: none;
}

.note {
    margin-top: 24px;
    padding: 12px;
    background: #ffffff05;
    border: 1px solid #ffffff10;
    border-radius: 4px;
    color: #737c90;
    font-size: 10px;
    line-height: 1.8;
    text-align: center;
}

@media (max-height: 600px) {
    body { align-items: flex-start; }
    .container { margin: 35px 0; }
    .logo-container { margin-bottom: 18px; }
    .slogan { margin-bottom: 24px; }
}
</style>
</head>

<body>
<main class="container">

    <button class="lang-btn" type="button">🌐 EN</button>

    <div class="logo-container">
        <div class="logo-text">
            MDUY
            <div class="logo-sub">MODZ</div>
        </div>
    </div>

    <div class="slogan">
        NO ACCOUNT. NO PASSWORD. JUST YOUR KEY.
    </div>

    <form id="access-form">
        <div class="input-group">
            <label class="input-label" for="key-input">
                ACCESS KEY
            </label>

            <div class="key-wrapper">
                <input
                    type="text"
                    id="key-input"
                    placeholder="ENTER YOUR KEY"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                    required
                >

                <button
                    class="paste-btn"
                    id="paste-btn"
                    type="button"
                >PASTE</button>
            </div>
        </div>

        <button class="unlock-btn" id="unlock-btn" type="submit">
            UNLOCK
        </button>

        <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>

    <div class="footer">
        No key? Contact your seller.<br>
        Your time starts when you connect.
    </div>

    <div class="note">
        SECURE ACCESS SYSTEM<br>
        Key verification is handled by the official Trollmodz website.
    </div>

</main>

<script>
"use strict";

const OFFICIAL_URL = "https://client.trollmodz.store/";

const form = document.getElementById("access-form");
const keyInput = document.getElementById("key-input");
const pasteBtn = document.getElementById("paste-btn");
const unlockBtn = document.getElementById("unlock-btn");
const statusBox = document.getElementById("status");

function setStatus(message, type = "") {
    statusBox.textContent = message;
    statusBox.className = "status" + (type ? " " + type : "");
}

pasteBtn.addEventListener("click", async () => {
    try {
        if (!navigator.clipboard || !navigator.clipboard.readText) {
            throw new Error("Clipboard unavailable");
        }

        const value = await navigator.clipboard.readText();

        if (value) {
            keyInput.value = value.trim();
            setStatus("KEY PASTED");
        } else {
            setStatus("CLIPBOARD IS EMPTY", "error");
        }
    } catch {
        setStatus(
            "PASTE IS UNAVAILABLE. PLEASE PASTE YOUR KEY MANUALLY.",
            "error"
        );
        keyInput.focus();
    }
});

form.addEventListener("submit", (event) => {
    event.preventDefault();

    const key = keyInput.value.trim();

    if (!key) {
        setStatus("PLEASE ENTER YOUR ACCESS KEY", "error");
        keyInput.focus();
        return;
    }

    unlockBtn.disabled = true;
    unlockBtn.textContent = "OPENING...";
    setStatus("OPENING OFFICIAL TROLLMODZ LOGIN...");

    // Open the official website without pretending the key
    // has already been verified.
    window.location.assign(OFFICIAL_URL);
});
</script>
</body>
</html>
