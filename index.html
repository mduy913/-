<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Upload Ảnh - Link Trực Tiếp</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2a 50%, #0a0a1a 100%);
    color: #fff;
    min-height: 100vh;
    padding: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.container { max-width: 600px; width: 100%; }

h1 {
    text-align: center;
    font-size: 24px;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #a855f7, #ec4899, #f59e0b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 900;
}
.subtitle {
    text-align: center;
    font-size: 12px;
    color: #888;
    margin-bottom: 20px;
}

.card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(168,85,247,0.3);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
}
.label {
    font-size: 11px;
    font-weight: 800;
    color: #a855f7;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.drop-zone {
    position: relative;
    display: block;
    width: 100%;
    padding: 40px 20px;
    background: rgba(0,0,0,0.3);
    border: 3px dashed rgba(168,85,247,0.5);
    border-radius: 14px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
}
.drop-zone:hover { border-color: #a855f7; background: rgba(168,85,247,0.05); }
.drop-zone.drag { border-color: #22c55e; background: rgba(34,197,94,0.1); }
.drop-zone input[type="file"] {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
    cursor: pointer;
}
.drop-icon { font-size: 60px; margin-bottom: 10px; animation: bounce 2s ease-in-out infinite; }
.drop-text { font-size: 16px; color: #ddd; font-weight: 700; margin-bottom: 6px; }
.drop-sub { font-size: 12px; color: #888; }
@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

/* PREVIEW */
.preview-box {
    position: relative;
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 12px;
    display: none;
    text-align: center;
}
.preview-box.show { display: block; }
.preview-img {
    max-width: 100%;
    max-height: 250px;
    border-radius: 10px;
    display: block;
    margin: 0 auto;
}
.preview-info {
    margin-top: 10px;
    font-size: 11px;
    color: #888;
    line-height: 1.5;
}
.clear-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(239,68,68,0.9);
    border: none;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* BUTTONS */
button.main-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #a855f7, #ec4899);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
    letter-spacing: 1px;
    margin-top: 10px;
}
button.main-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(168,85,247,0.4); }
button.main-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* STATUS */
.status {
    font-size: 12px;
    text-align: center;
    padding: 12px;
    color: #22c55e;
    min-height: 40px;
    line-height: 1.5;
    background: rgba(0,0,0,0.3);
    border-radius: 10px;
    margin-top: 12px;
    word-break: break-all;
}
.status.error { color: #ef4444; }
.status.loading { color: #f59e0b; }

/* RESULT */
.result {
    background: linear-gradient(135deg, rgba(34,197,94,0.1), rgba(0,180,216,0.1));
    border: 2px solid rgba(34,197,94,0.4);
    border-radius: 14px;
    padding: 16px;
    margin-top: 14px;
    display: none;
}
.result.show { display: block; animation: slideIn 0.4s ease; }
@keyframes slideIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
.result-title {
    font-size: 12px;
    font-weight: 800;
    color: #22c55e;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.result-url {
    background: rgba(0,0,0,0.4);
    border-radius: 10px;
    padding: 12px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: #86efac;
    word-break: break-all;
    line-height: 1.6;
    border: 1px solid rgba(34,197,94,0.2);
    margin-bottom: 10px;
    user-select: all;
    -webkit-user-select: all;
}
.result-actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
}
.result-btn {
    padding: 12px 8px;
    border: none;
    border-radius: 10px;
    color: #fff;
    font-weight: 800;
    font-size: 11px;
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
}
.result-btn:hover { transform: translateY(-2px); }
.btn-copy { background: linear-gradient(135deg, #22c55e, #16a34a); }
.btn-open { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
.btn-new { background: linear-gradient(135deg, #a855f7, #ec4899); }

/* HISTORY */
.history {
    max-height: 300px;
    overflow-y: auto;
}
.history-item {
    display: flex;
    gap: 10px;
    padding: 10px;
    background: rgba(0,0,0,0.3);
    border-radius: 10px;
    margin-bottom: 8px;
    align-items: center;
}
.history-thumb {
    width: 60px;
    height: 60px;
    border-radius: 8px;
    object-fit: cover;
    background: #000;
    flex-shrink: 0;
}
.history-info {
    flex: 1;
    min-width: 0;
}
.history-url {
    font-size: 10px;
    color: #86efac;
    font-family: 'Courier New', monospace;
    word-break: break-all;
    margin-bottom: 4px;
    cursor: pointer;
}
.history-url:active { color: #fff; }
.history-time {
    font-size: 9px;
    color: #666;
}
.history-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
}
.history-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: rgba(168,85,247,0.2);
    color: #d0b0ff;
    font-size: 12px;
    cursor: pointer;
}
.history-empty {
    text-align: center;
    padding: 30px 20px;
    color: #666;
    font-style: italic;
    font-size: 12px;
}

/* HINT */
.hint {
    background: rgba(59,130,246,0.1);
    border: 1px solid rgba(59,130,246,0.4);
    border-radius: 10px;
    padding: 12px;
    font-size: 11px;
    color: #93c5fd;
    line-height: 1.6;
    margin-bottom: 14px;
}
.hint b { color: #60a5fa; }
</style>
</head>
<body>

<div class="container">
    <h1>📸 UPLOAD ẢNH</h1>
    <div class="subtitle">Chọn ảnh → Nhận link .png trực tiếp</div>

    <div class="hint">
        💡 <b>Cách dùng:</b> Chọn ảnh → Đợi upload → Copy link → Dán vào shop, Facebook, forum...<br>
        <b>Link vĩnh viễn</b> — Không cần tài khoản — Miễn phí hoàn toàn.
    </div>

    <!-- UPLOAD -->
    <div class="card">
        <div class="label">1️⃣ CHỌN ẢNH</div>
        <label class="drop-zone" id="drop-zone">
            <input type="file" id="file-input" accept="image/*" multiple>
            <div class="drop-icon">📷</div>
            <div class="drop-text">Nhấn để chọn ảnh</div>
            <div class="drop-sub">Hoặc kéo thả ảnh vào đây</div>
            <div class="drop-sub" style="margin-top:6px;">Hỗ trợ: JPG, PNG, GIF, WEBP</div>
        </label>
    </div>

    <!-- PREVIEW -->
    <div class="preview-box" id="preview-box">
        <button class="clear-btn" id="clear-btn">✕</button>
        <img class="preview-img" id="preview-img">
        <div class="preview-info" id="preview-info"></div>
    </div>

    <!-- UPLOAD BUTTON -->
    <button class="main-btn" id="upload-btn" disabled>🚀 UPLOAD ẢNH</button>

    <div class="status" id="status">Chọn ảnh để bắt đầu</div>

    <!-- RESULT -->
    <div class="result" id="result">
        <div class="result-title">✅ Upload thành công!</div>
        <div class="result-url" id="result-url"></div>
        <div class="result-actions">
            <button class="result-btn btn-copy" id="copy-btn">
                📋 COPY
            </button>
            <button class="result-btn btn-open" id="open-btn">
                👁 XEM
            </button>
            <button class="result-btn btn-new" id="new-btn">
                ➕ ẢNH MỚI
            </button>
        </div>
    </div>

    <!-- HISTORY -->
    <div class="card" id="history-card" style="display:none;">
        <div class="label">📜 LỊCH SỬ UPLOAD</div>
        <div class="history" id="history"></div>
    </div>
</div>

<script>
(function() {
    'use strict';

    var $ = function(id) { return document.getElementById(id); };
    var selectedFile = null;
    var uploadHistory = [];

    try {
        var saved = localStorage.getItem('upload_history');
        if (saved) uploadHistory = JSON.parse(saved);
    } catch(e) {}

    function setStatus(text, type) {
        var el = $('status');
        el.textContent = text;
        el.className = 'status' + (type ? ' ' + type : '');
    }

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1024 / 1024).toFixed(2) + ' MB';
    }

    function reset() {
        selectedFile = null;
        $('preview-box').classList.remove('show');
        $('result').classList.remove('show');
        $('file-input').value = '';
        $('upload-btn').disabled = true;
        setStatus('Chọn ảnh để bắt đầu');
    }

    // Chọn file
    $('file-input').addEventListener('change', function(e) {
        var file = e.target.files[0];
        if (!file) return;
        handleFile(file);
    });

    // Kéo thả
    var dropZone = $('drop-zone');
    dropZone.addEventListener('dragover', function(e) {
        e.preventDefault();
        dropZone.classList.add('drag');
    });
    dropZone.addEventListener('dragleave', function() {
        dropZone.classList.remove('drag');
    });
    dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        dropZone.classList.remove('drag');
        var file = e.dataTransfer.files[0];
        if (file) handleFile(file);
    });

    function handleFile(file) {
        if (!file.type.startsWith('image/')) {
            setStatus('❌ File không phải ảnh!', 'error');
            return;
        }
        if (file.size > 5 * 1024 * 1024) {
            setStatus('❌ Ảnh quá lớn (>5MB). Nén lại trước khi upload!', 'error');
            return;
        }

        selectedFile = file;

        var reader = new FileReader();
        reader.onload = function(e) {
            $('preview-img').src = e.target.result;
            $('preview-info').textContent = file.name + ' • ' + formatSize(file.size);
            $('preview-box').classList.add('show');
            $('upload-btn').disabled = false;
            setStatus('✅ Đã chọn ảnh. Nhấn UPLOAD để tiếp tục', 'success');
            $('result').classList.remove('show');
        };
        reader.readAsDataURL(file);
    }

    // Xoá ảnh
    $('clear-btn').onclick = reset;

    // Upload
    $('upload-btn').onclick = function() {
        if (!selectedFile) return;

        var btn = $('upload-btn');
        btn.disabled = true;
        btn.textContent = '⏳ ĐANG UPLOAD...';
        setStatus('⏳ Đang upload ảnh lên server...', 'loading');

        var formData = new FormData();
        formData.append('reqtype', 'fileupload');
        formData.append('fileToUpload', selectedFile);

        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'https://catbox.moe/user/api.php', true);
        xhr.timeout = 60000;

        xhr.onload = function() {
            if (xhr.status === 200) {
                var url = xhr.responseText.trim();
                if (url && url.indexOf('http') === 0) {
                    showResult(url);
                    addToHistory(url, selectedFile.name);
                } else {
                    setStatus('❌ Lỗi: ' + url, 'error');
                    btn.disabled = false;
                    btn.textContent = '🚀 UPLOAD ẢNH';
                }
            } else {
                setStatus('❌ Lỗi HTTP ' + xhr.status + '. Thử lại sau!', 'error');
                btn.disabled = false;
                btn.textContent = '🚀 UPLOAD ẢNH';
            }
        };

        xhr.onerror = function() {
            setStatus('❌ Lỗi mạng. Kiểm tra kết nối!', 'error');
            btn.disabled = false;
            btn.textContent = '🚀 UPLOAD ẢNH';
        };

        xhr.ontimeout = function() {
            setStatus('❌ Timeout 60s. Ảnh có thể quá lớn!', 'error');
            btn.disabled = false;
            btn.textContent = '🚀 UPLOAD ẢNH';
        };

        xhr.send(formData);
    };

    function showResult(url) {
        $('result-url').textContent = url;
        $('result').classList.add('show');
        setStatus('✅ Upload thành công! Link đã sẵn sàng', 'success');

        $('upload-btn').disabled = false;
        $('upload-btn').textContent = '🚀 UPLOAD ẢNH';

        // Auto copy
        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(function() {
                    $('copy-btn').innerHTML = '✅ ĐÃ COPY';
                    setTimeout(function() {
                        $('copy-btn').innerHTML = '📋 COPY';
                    }, 2000);
                });
            }
        } catch(e) {}
    }

    // Copy
    $('copy-btn').onclick = function() {
        var url = $('result-url').textContent;
        if (!url) return;

        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(function() {
                    $('copy-btn').innerHTML = '✅ ĐÃ COPY';
                    setTimeout(function() {
                        $('copy-btn').innerHTML = '📋 COPY';
                    }, 2000);
                });
            } else {
                var ta = document.createElement('textarea');
                ta.value = url;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                $('copy-btn').innerHTML = '✅ ĐÃ COPY';
                setTimeout(function() {
                    $('copy-btn').innerHTML = '📋 COPY';
                }, 2000);
            }
        } catch(e) {
            setStatus('❌ Không copy được. Tự bôi đen link để copy!', 'error');
        }
    };

    // Mở link
    $('open-btn').onclick = function() {
        var url = $('result-url').textContent;
        if (url) window.open(url, '_blank');
    };

    // Ảnh mới
    $('new-btn').onclick = reset;

    // Lịch sử
    function addToHistory(url, name) {
        uploadHistory.unshift({
            url: url,
            name: name,
            time: Date.now()
        });
        if (uploadHistory.length > 20) uploadHistory.pop();

        try {
            localStorage.setItem('upload_history', JSON.stringify(uploadHistory));
        } catch(e) {}

        renderHistory();
    }

    function renderHistory() {
        var el = $('history');
        var card = $('history-card');

        if (uploadHistory.length === 0) {
            card.style.display = 'none';
            return;
        }

        card.style.display = 'block';
        var html = '';

        uploadHistory.forEach(function(item, idx) {
            var time = new Date(item.time).toLocaleString('vi-VN');
            html += '<div class="history-item">';
            html += '<img class="history-thumb" src="' + item.url + '" onerror="this.src=\'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22><rect width=%2260%22 height=%2260%22 fill=%22%23222%22/><text x=%2230%22 y=%2235%22 font-size=%2220%22 text-anchor=%22middle%22 fill=%22%23666%22>?</text></svg>\'">';
            html += '<div class="history-info">';
            html += '<div class="history-url" onclick="window.open(\'' + item.url + '\',\'_blank\')">' + item.url.substring(0, 50) + (item.url.length > 50 ? '...' : '') + '</div>';
            html += '<div class="history-time">' + time + '</div>';
            html += '</div>';
            html += '<div class="history-actions">';
            html += '<button class="history-btn" onclick="copyHistory(' + idx + ')">📋</button>';
            html += '</div>';
            html += '</div>';
        });

        el.innerHTML = html;
    }

    window.copyHistory = function(idx) {
        var url = uploadHistory[idx].url;
        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url);
                setStatus('✅ Đã copy link từ lịch sử', 'success');
            } else {
                var ta = document.createElement('textarea');
                ta.value = url;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                setStatus('✅ Đã copy link', 'success');
            }
        } catch(e) {
            setStatus('❌ Không copy được. Nhấn vào link để xem!', 'error');
        }
    };

    renderHistory();

    console.log('%c📸 Upload Ảnh đã sẵn sàng!', 'color: #a855f7; font-size: 14px; font-weight: bold;');
})();
</script>

</body>
</html>
