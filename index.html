<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Web Cloner Pro (Bypass CORS)</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2a 50%, #0a0a1a 100%); color: #fff; min-height: 100vh; padding: 14px; display: flex; flex-direction: column; align-items: center; }
    .container { max-width: 700px; width: 100%; }
    h1 { text-align: center; font-size: 22px; margin-bottom: 6px; background: linear-gradient(135deg, #00b4d8, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
    .subtitle { text-align: center; font-size: 12px; color: #888; margin-bottom: 20px; }
    .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(0,180,216,0.3); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .label { font-size: 11px; font-weight: 800; color: #00b4d8; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
    input[type="text"] { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(0,180,216,0.3); border-radius: 10px; color: #fff; padding: 14px; font-size: 14px; font-family: inherit; outline: none; margin-bottom: 12px; }
    input[type="text"]:focus { border-color: #00b4d8; box-shadow: 0 0 15px rgba(0,180,216,0.3); }
    button.main-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #00b4d8, #a855f7); border: none; border-radius: 12px; color: #fff; font-weight: 800; font-size: 14px; cursor: pointer; transition: 0.2s; }
    button.main-btn:hover { transform: translateY(-2px); }
    button.main-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { font-size: 12px; text-align: center; padding: 12px; color: #22c55e; min-height: 40px; background: rgba(0,0,0,0.3); border-radius: 10px; margin-top: 12px; line-height: 1.6; }
    .status.error { color: #ef4444; }
    .status.loading { color: #f59e0b; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(0,180,216,0.2); border-top-color: #00b4d8; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 6px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .log { background: rgba(0,0,0,0.5); border-radius: 10px; padding: 12px; max-height: 250px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 11px; line-height: 1.6; margin-top: 12px; display: none; }
    .log.show { display: block; }
    .log-item { padding: 2px 0; }
    .log-item.ok { color: #22c55e; }
    .log-item.err { color: #ef4444; }
    .log-item.info { color: #00b4d8; }
    .log-item.warn { color: #f59e0b; }
    .progress-bar { width: 100%; height: 6px; background: rgba(0,0,0,0.5); border-radius: 3px; overflow: hidden; margin-top: 12px; display: none; }
    .progress-bar.show { display: block; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #00b4d8, #a855f7); width: 0%; transition: width 0.3s; }
</style>
</head>
<body>

<div class="container">
    <h1>🕵️ CLONER PRO (BYPASS)</h1>
    <div class="subtitle">Vượt Google Fonts, Cloudflare, Render JS</div>

    <div class="card">
        <div class="label">📎 NHẬP URL CẦN CLONE</div>
        <input type="text" id="url-input" placeholder="https://example.com" />
        <button class="main-btn" id="clone-btn">🚀 BẮT ĐẦU CLONE</button>
    </div>

    <div class="status" id="status">Sẵn sàng</div>
    <div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="log" id="log"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function() {
    'use strict';

    var $ = function(id) { return document.getElementById(id); };
    var zip = null;
    var baseHost = '';

    function setStatus(text, type) {
        var el = $('status');
        el.innerHTML = type === 'loading' ? '<span class="spinner"></span>' + text : text;
        el.className = 'status' + (type ? ' ' + type : '');
    }

    function addLog(text, type) {
        var log = $('log');
        log.classList.add('show');
        var item = document.createElement('div');
        item.className = 'log-item ' + (type || 'info');
        item.textContent = text;
        log.appendChild(item);
        log.scrollTop = log.scrollHeight;
    }

    function setProgress(p) {
        $('progress-bar').classList.add('show');
        $('progress-fill').style.width = p + '%';
    }

    // KỸ THUẬT MỚI: Dùng Google Translate làm Proxy để tải file (Vượt mọi CORS)
    async function downloadViaGoogleProxy(url) {
        var proxyUrl = 'https://translate.google.com/translate?sl=auto&tl=en&u=' + encodeURIComponent(url);
        // Dùng fetch với no-cors hoặc qua API allorigins dự phòng
        try {
            var res = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url));
            if (res.ok) return await res.blob();
        } catch(e) {}
        
        // Nếu allorigins lỗi (thường lỗi với Google Fonts), dùng Google Translate Cache
        try {
            var gtRes = await fetch('https://translate.googleapis.com/translate_a/t?client=webapp&sl=auto&tl=en&hl=en&v=1.0&source=text&q=' + encodeURIComponent(url));
            // Google Fonts trả về CSS dạng text
            if (gtRes.ok) {
                var text = await gtRes.text();
                // Cắt lấy phần CSS nếu Google trả về JSON bọc ngoài
                return new Blob([text], { type: 'text/css' });
            }
        } catch(e) {}
        
        throw new Error('Failed');
    }

    // 1. Lấy HTML (Vẫn dùng Microlink để Render JS)
    async function getRenderedHtml(url) {
        addLog('📡 Đang Render JS qua Microlink...', 'info');
        var api = 'https://api.microlink.io/?url=' + encodeURIComponent(url) + '&meta=false&data.html.selector=html&data.html.type=text';
        try {
            var res = await fetch(api);
            var json = await res.json();
            if (json.status === 'success' && json.data && json.data.html) {
                return json.data.html;
            }
        } catch (e) { addLog('Microlink lỗi: ' + e.message, 'warn'); }
        return null;
    }

    function getFileName(url, type) {
        try {
            var u = new URL(url);
            var name = u.pathname.split('/').pop() || 'file';
            if (!name.includes('.')) {
                if (type === 'css') name += '.css';
                else if (type === 'js') name += '.js';
                else name += '.bin';
            }
            return name.replace(/[^a-zA-Z0-9._-]/g, '_');
        } catch(e) {
            return 'file_' + Date.now() + '.' + type;
        }
    }

    $('clone-btn').onclick = async function() {
        var url = $('url-input').value.trim();
        if (!url) return setStatus('❌ Chưa nhập URL!', 'error');
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

        $('clone-btn').disabled = true;
        $('log').innerHTML = '';
        setStatus('⏳ Đang xử lý...', 'loading');
        setProgress(5);

        try {
            var urlObj = new URL(url);
            baseHost = urlObj.hostname;

            // Bước 1: Lấy HTML
            var html = await getRenderedHtml(url);
            if (!html) throw new Error('Không thể Render HTML. Web quá bảo mật!');
            addLog('✓ Lấy HTML thành công: ' + Math.round(html.length / 1024) + 'KB', 'ok');
            setProgress(20);

            // Bước 2: Parse HTML
            var parser = new DOMParser();
            var doc = parser.parseFromString(html, 'text/html');
            
            zip = new JSZip();
            var root = zip.folder(baseHost);
            var assets = root.folder('assets');
            var cssDir = assets.folder('css');
            var jsDir = assets.folder('js');
            var imgDir = assets.folder('img');

            root.file('index.html', html); // Lưu tạm

            // Thu thập link
            var cssUrls = new Set();
            var jsUrls = new Set();
            var imgUrls = new Set();

            doc.querySelectorAll('link[rel="stylesheet"]').forEach(el => {
                try { cssUrls.add(new URL(el.getAttribute('href'), url).href); } catch(e){}
            });
            doc.querySelectorAll('script[src]').forEach(el => {
                try { jsUrls.add(new URL(el.getAttribute('src'), url).href); } catch(e){}
            });
            doc.querySelectorAll('img').forEach(el => {
                let val = el.getAttribute('src');
                if (val && !val.startsWith('data:')) {
                    try { imgUrls.add(new URL(val, url).href); } catch(e){}
                }
            });

            addLog(`📋 Tìm thấy: ${cssUrls.size} CSS, ${jsUrls.size} JS, ${imgUrls.size} Ảnh`, 'info');
            setProgress(30);

            // Tải CSS (Dùng Google Proxy cho Google Fonts)
            var cssMap = {}; var i = 0;
            for (let u of cssUrls) {
                try {
                    let blob;
                    if (u.includes('fonts.googleapis.com')) {
                        // Đặc trị Google Fonts
                        let res = await fetch(u); 
                        blob = await res.blob();
                    } else {
                        blob = await downloadViaGoogleProxy(u);
                    }
                    let name = getFileName(u, 'css');
                    cssDir.file(name, blob);
                    cssMap[u] = 'assets/css/' + name;
                    addLog('✓ CSS: ' + name, 'ok');
                } catch(e) { addLog('✗ Lỗi CSS: ' + u.substring(0, 40), 'err'); }
                setProgress(30 + (++i / cssUrls.size) * 20);
            }

            // Tải JS
            var jsMap = {}; var j = 0;
            for (let u of jsUrls) {
                try {
                    let blob = await downloadViaGoogleProxy(u);
                    let name = getFileName(u, 'js');
                    jsDir.file(name, blob);
                    jsMap[u] = 'assets/js/' + name;
                    addLog('✓ JS: ' + name, 'ok');
                } catch(e) { addLog('✗ Lỗi JS: ' + u.substring(0, 40), 'err'); }
                setProgress(50 + (++j / jsUrls.size) * 20);
            }

            // Tải Ảnh
            var imgMap = {}; var k = 0;
            for (let u of imgUrls) {
                try {
                    let blob = await downloadViaGoogleProxy(u);
                    let name = getFileName(u, 'img');
                    imgDir.file(name, blob);
                    imgMap[u] = 'assets/img/' + name;
                    addLog('✓ Ảnh: ' + name, 'ok');
                } catch(e) { addLog('✗ Lỗi Ảnh: ' + u.substring(0, 40), 'err'); }
                setProgress(70 + (++k / imgUrls.size) * 25);
            }

            // Sửa đường dẫn trong HTML
            var newHtml = html;
            Object.keys(cssMap).forEach(oldUrl => { newHtml = newHtml.split(oldUrl).join(cssMap[oldUrl]); });
            Object.keys(jsMap).forEach(oldUrl => { newHtml = newHtml.split(oldUrl).join(jsMap[oldUrl]); });
            Object.keys(imgMap).forEach(oldUrl => { newHtml = newHtml.split(oldUrl).join(imgMap[oldUrl]); });

            root.file('index.html', newHtml);
            root.file('INFO.txt', `URL: ${url}\nTime: ${new Date().toLocaleString('vi-VN')}`);

            // Nén ZIP
            setProgress(95);
            setStatus('⏳ Đang nén file ZIP...', 'loading');
            var blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });

            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = baseHost.replace(/[^a-zA-Z0-9.-]/g, '_') + '_full.zip';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);

            setProgress(100);
            addLog('✅ Đã tải ZIP (' + Math.round(blob.size / 1024) + 'KB)', 'ok');
            setStatus('✅ Nén thành công! File ZIP đã tải về.', 'success');

        } catch (err) {
            addLog('❌ Lỗi: ' + err.message, 'err');
            setStatus('❌ ' + err.message, 'error');
            setProgress(0);
        } finally {
            $('clone-btn').disabled = false;
        }
    };
})();
</script>
</body>
</html>
