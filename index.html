
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0b10">
<title>MDUY MODZ - Access</title>

<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #0a0b10;
    --cyan: #00e5ff;
    --sub: #8b92a5;
    --red: #ff4b4b;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Chakra Petch', sans-serif;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: var(--bg);
    color: white;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    width: 300px;
    height: 300px;
    top: 15%;
    left: 50%;
    transform: translateX(-50%);
    background: #00e5ff12;
    filter: blur(90px);
    pointer-events: none;
}

.container {
    width: 100%;
    max-width: 400px;
    position: relative;
    z-index: 1;
    animation: appear .5s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

.lang-btn {
    position: absolute;
    top: 0;
    right: 0;
    padding: 8px 12px;
    color: var(--sub);
    background: #ffffff08;
    border: 1px solid #ffffff20;
    border-radius: 4px;
    font-size: 12px;
}

.logo-container {
    text-align: center;
    margin-bottom: 28px;
}

.logo-text {
    font-size: 54px;
    font-weight: 700;
    font-style: italic;
    line-height: 1;
    text-shadow: 0 0 25px #00e5ff70;
}

.logo-sub {
    display: block;
    margin-top: 8px;
    color: var(--cyan);
    font-size: 22px;
    letter-spacing: 7px;
}

.slogan {
    color: var(--sub);
    font-size: 10px;
    letter-spacing: 1.5px;
    text-align: center;
    margin-bottom: 42px;
}

.input-group {
    margin-bottom: 18px;
}

.input-label {
    display: block;
    color: var(--cyan);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 10px;
}

.input-label::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    margin-right: 8px;
}

.key-wrapper {
    display: flex;
    width: 100%;
    background: #11131a;
    border: 1px solid #00e5ff88;
    border-radius: 5px;
    overflow: hidden;
}

.key-wrapper:focus-within {
    border-color: var(--cyan);
    box-shadow: 0 0 15px #00e5ff20;
}

.key-wrapper input {
    flex: 1;
    min-width: 0;
    width: 0;
    padding: 18px 12px;
    background: transparent;
    border: 0;
    outline: none;
    color: white;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
}

.key-wrapper input::placeholder {
    color: #596174;
    font-size: 11px;
}

.paste-btn {
    flex-shrink: 0;
    padding: 0 16px;
    color: white;
    background: #1a1c23;
    border: 0;
    border-left: 1px solid #333;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
}

.unlock-btn {
    display: block;
    width: 100%;
    padding: 18px;
    margin-bottom: 16px;
    background: var(--cyan);
    color: #000;
    border: 0;
    border-radius: 4px;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    clip-path: polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);
    -webkit-appearance: none;
    appearance: none;
}

.unlock-btn:active {
    opacity: .8;
}

.unlock-btn:disabled {
    opacity: .6;
}

.status {
    min-height: 20px;
    margin-bottom: 16px;
    color: var(--cyan);
    font-size: 12px;
    text-align: center;
    overflow-wrap: anywhere;
}

.status.error {
    color: var(--red);
}

.footer {
    color: var(--sub);
    font-size: 12px;
    line-height: 2;
    text-align: center;
}

.note {
    margin-top: 24px;
    padding: 12px;
    color: #737c90;
    font-size: 10px;
    line-height: 1.8;
    text-align: center;
    border: 1px solid #ffffff12;
    border-radius: 4px;
}

@media (max-height: 600px) {
    body { align-items: flex-start; }
    .container { margin: 30px 0; }
    .slogan { margin-bottom: 24px; }
}
</style>
</head>

<body>
<main class="container">

    <button class="lang-btn" type="button">🌐 EN</button>

    <header class="logo-container">
        <div class="logo-text">
            MDUY
            <span class="logo-sub">MODZ</span>
        </div>
    </header>

    <div class="slogan">
        NO ACCOUNT. NO PASSWORD. JUST YOUR KEY.
    </div>

    <form id="access-form">
        <div class="input-group">
            <label class="input-label" for="key-input">
                ACCESS KEY
            </label>

            <div class="key-wrapper">
                <input
                    id="key-input"
                    type="text"
                    placeholder="ENTER YOUR ACCESS KEY"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                    required
                >

                <button
                    class="paste-btn"
                    id="paste-btn"
                    type="button"
                >PASTE</button>
            </div>
        </div>

        <button class="unlock-btn" id="unlock-btn" type="submit">
            UNLOCK
        </button>

        <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>

    <footer class="footer">
        No key? Contact your seller.<br>
        Your time starts when you connect.
    </footer>

    <div class="note">
        MDUY MODZ ACCESS SYSTEM<br>
        Authentication is handled by the official service.
    </div>

</main>

<script>
(function () {
    "use strict";

    const OFFICIAL_URL = "https://client.trollmodz.store/";

    const form = document.getElementById("access-form");
    const keyInput = document.getElementById("key-input");
    const pasteBtn = document.getElementById("paste-btn");
    const unlockBtn = document.getElementById("unlock-btn");
    const statusBox = document.getElementById("status");

    function setStatus(message, isError) {
        statusBox.textContent = message;
        statusBox.className = isError
            ? "status error"
            : "status";
    }

    pasteBtn.addEventListener("click", async function () {
        try {
            const text = await navigator.clipboard.readText();

            if (!text.trim()) {
                setStatus("CLIPBOARD IS EMPTY", true);
                return;
            }

            keyInput.value = text.trim();
            setStatus("KEY PASTED SUCCESSFULLY", false);
        } catch (error) {
            setStatus(
                "PASTE BLOCKED. PLEASE PASTE YOUR KEY MANUALLY.",
                true
            );
            keyInput.focus();
        }
    });

    form.addEventListener("submit", function (event) {
        event.preventDefault();

        const key = keyInput.value.trim();

        if (!key) {
            setStatus("PLEASE ENTER YOUR ACCESS KEY", true);
            keyInput.focus();
            return;
        }

        setStatus("OPENING OFFICIAL TROLLMODZ WEBSITE...", false);
        unlockBtn.disabled = true;
        unlockBtn.textContent = "OPENING...";

        // Opening the official site does not authenticate the key.
        // Automatic login requires an officially supported integration.
        window.location.href = OFFICIAL_URL;
    });

    keyInput.addEventListener("input", function () {
        if (statusBox.textContent) {
            setStatus("", false);
        }

        unlockBtn.disabled = false;
        unlockBtn.textContent = "UNLOCK";
    });
})();
</script>

</body>
</html>
