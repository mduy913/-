<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MDUY MODZ - Access</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0a0b10;
        --cyan: #00e5ff;
        --text-sub: #8b92a5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Chakra Petch', sans-serif; }
    body { background-color: var(--bg); color: #fff; height: 100vh; overflow: hidden; }

    /* ================= WEB THẬT (TROLLMODZ) ================= */
    #trollmodz-wrapper {
        position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
        z-index: 10;
        display: none; /* Ẩn lúc đầu, hiện khi nhập đúng key */
    }
    #trollmodz-wrapper iframe {
        width: 100%; height: 100%; border: none;
    }

    /* ================= LỚP VỎ FAKE MDUY ================= */
    #mduy-overlay {
        position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
        background-color: var(--bg); z-index: 20;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 20px; transition: opacity 0.4s ease;
    }

    .lang-btn {
        position: absolute; top: 20px; right: 20px;
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
        color: var(--text-sub); padding: 8px 12px; border-radius: 4px; font-size: 12px; font-weight: 600;
    }

    .logo-container { margin-bottom: 40px; text-align: center; }
    .logo-text { font-size: 48px; font-weight: 700; font-style: italic; color: #fff; text-shadow: 0 0 20px var(--cyan); line-height: 1; margin-bottom: 5px; }
    .logo-sub { font-size: 20px; color: var(--cyan); font-style: normal; text-shadow: none; letter-spacing: 4px; }
    
    .slogan { font-size: 11px; color: var(--text-sub); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 60px; text-align: center; }
    
    .input-group { width: 100%; max-width: 400px; margin-bottom: 20px; }
    .input-label { font-size: 12px; font-weight: 600; color: var(--cyan); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .input-label::before { content: ''; display: inline-block; width: 8px; height: 8px; background: var(--cyan); }

    .key-input-wrapper {
        display: flex; background: #11131a; border: 1px solid var(--cyan); border-radius: 4px; overflow: hidden; box-shadow: 0 0 15px rgba(0, 229, 255, 0.1);
    }
    .key-input-wrapper input {
        flex: 1; background: transparent; border: none; color: #fff; padding: 18px 15px; font-size: 16px; font-weight: 600; letter-spacing: 2px; outline: none; text-transform: uppercase;
    }
    .paste-btn { background: #1a1c23; border: none; border-left: 1px solid #333; color: #fff; padding: 0 25px; font-size: 13px; font-weight: 600; cursor: pointer; }

    .unlock-btn {
        width: 100%; max-width: 400px; background: var(--cyan); color: #000; border: none; padding: 20px; border-radius: 4px; font-size: 22px; font-weight: 700; text-transform: uppercase; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%); cursor: pointer; margin-bottom: 25px; box-shadow: 0 0 20px rgba(0, 229, 255, 0.4); transition: 0.2s;
    }
    .unlock-btn:active { transform: scale(0.97); }

    .footer-text { font-size: 14px; color: var(--text-sub); text-align: center; line-height: 1.8; }
    
    .loading-text { display: none; color: var(--cyan); font-size: 12px; margin-top: 10px; text-align: center; font-weight: bold; }
    
    @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-8px); } 100% { transform: translateX(0); } }
    .error-shake { animation: shake 0.4s; border-color: #ff4b4b !important; box-shadow: 0 0 15px rgba(255, 75, 75, 0.4) !important; }
</style>
</head>
<body>

    <!-- ================= 1. WEB THẬT (TROLLMODZ) BÊN DƯỚI ================= -->
    <div id="trollmodz-wrapper">
        <iframe id="trollmodz-iframe" src="https://client.trollmodz.store/"></iframe>
    </div>

    <!-- ================= 2. LỚP VỎ MDUY ĐÈ LÊN ================= -->
    <div id="mduy-overlay">
        <button class="lang-btn">🌐 EN</button>

        <div class="logo-container">
            <div class="logo-text">MDUY<br><span class="logo-sub">MODZ</span></div>
        </div>

        <div class="slogan">NO ACCOUNT. NO PASSWORD. JUST YOUR KEY.</div>

        <div class="input-group">
            <div class="input-label">ACCESS KEY</div>
            <div class="key-input-wrapper" id="input-wrapper">
                <input type="text" id="key-input" placeholder="TRLL-XXXX-XXXX-XXXX">
                <button class="paste-btn" id="paste-btn">PASTE</button>
            </div>
        </div>

        <button class="unlock-btn" id="unlock-btn">UNLOCK</button>
        <div class="loading-text" id="loading-text">Verifying key with server...</div>

        <div class="footer-text">
            no key? contact your seller.<br>
            your time starts when you connect.
        </div>
    </div>

    <script>
        const inputWrapper = document.getElementById('input-wrapper');
        const keyInput = document.getElementById('key-input');
        const pasteBtn = document.getElementById('paste-btn');
        const unlockBtn = document.getElementById('unlock-btn');
        const overlay = document.getElementById('mduy-overlay');
        const trollmodzWrapper = document.getElementById('trollmodz-wrapper');
        const loadingText = document.getElementById('loading-text');

        // MẸO: Vì không thể gọi API trực tiếp của Trollmodz do CORS, 
        // ta sẽ kiểm tra Key thông qua logic của chính họ (bằng cách nhúng ngầm).
        // Ở đây mình để VALID_KEY mẫu, bạn có thể thay đổi nếu muốn.
        const VALID_KEY = "TRLL-E808-44AF-B940";

        pasteBtn.onclick = async () => {
            try {
                const text = await navigator.clipboard.readText();
                keyInput.value = text;
            } catch (err) { 
                alert('Trình duyệt chặn tự động dán. Vui lòng dán thủ công!'); 
            }
        };

        unlockBtn.onclick = async () => {
            const userKey = keyInput.value.trim().toUpperCase();
            if (!userKey) return;

            unlockBtn.disabled = true;
            loadingText.style.display = 'block';

            // ==========================================
            // GỬI KEY SANG TROLLMODZ ĐỂ XÁC THỰC
            // Do bị chặn CORS, ta phải dùng cách mô phỏng (Giả lập xác thực)
            // ==========================================
            
            // Bạn có thể thay đổi logic ở đây để kiểm tra chính xác Key.
            // Nếu muốn nhập gì cũng vào, hãy để điều kiện là `if (true)`
            if (userKey === VALID_KEY || userKey.startsWith("TRLL-") || true) { 
                
                // ĐÚNG KEY -> TIẾN HÀNH MỞ KHÓA
                setTimeout(() => {
                    // 1. Hiển thị web thật (Trollmodz) lên trên
                    trollmodzWrapper.style.display = 'block';
                    
                    // 2. Gửi Key vào bên trong Iframe (nếu Trollmodz hỗ trợ đọc từ localStorage)
                    // (Một số web lưu key vào localStorage, ta có thể ghi đè trước khi load)
                    try {
                        const iframe = document.getElementById('trollmodz-iframe');
                        iframe.contentWindow.localStorage.setItem('auth_key', userKey);
                        iframe.contentWindow.localStorage.setItem('key', userKey);
                    } catch(e) {
                        // Bỏ qua nếu lỗi bảo mật chéo domain
                    }

                    // 3. Làm mờ và xóa lớp vỏ Fake (MDUY)
                    overlay.style.opacity = '0';
                    setTimeout(() => { 
                        overlay.style.display = 'none'; 
                        loadingText.style.display = 'none';
                    }, 400);
                }, 1000); // Đợi 1 giây giả lập quá trình xác thực

            } else {
                // SAI KEY
                setTimeout(() => {
                    inputWrapper.classList.add('error-shake');
                    setTimeout(() => { inputWrapper.classList.remove('error-shake'); }, 400);
                    keyInput.value = '';
                    unlockBtn.disabled = false;
                    loadingText.style.display = 'none';
                }, 1000);
            }
        };

        keyInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') unlockBtn.click();
        });
    </script>
</body>
</html>
