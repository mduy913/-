<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Clone Web Pro - Vượt Rào Cản</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2a 50%, #0a0a1a 100%);
    color: #fff;
    min-height: 100vh;
    padding: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.container { max-width: 700px; width: 100%; }
h1 {
    text-align: center;
    font-size: 24px;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #00b4d8, #a855f7, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 900;
}
.subtitle { text-align: center; font-size: 12px; color: #888; margin-bottom: 20px; }
.card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(0,180,216,0.3);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
}
.label {
    font-size: 11px;
    font-weight: 800;
    color: #00b4d8;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
}
input[type="text"] {
    width: 100%;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(0,180,216,0.3);
    border-radius: 10px;
    color: #fff;
    padding: 14px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    margin-bottom: 12px;
}
input[type="text"]:focus { border-color: #00b4d8; box-shadow: 0 0 15px rgba(0,180,216,0.3); }
button.main-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #00b4d8, #a855f7);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
}
button.main-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,180,216,0.3); }
button.main-btn:disabled { opacity: 0.5; }
.status {
    font-size: 12px;
    text-align: center;
    padding: 12px;
    color: #22c55e;
    min-height: 40px;
    background: rgba(0,0,0,0.3);
    border-radius: 10px;
    margin-top: 12px;
    line-height: 1.6;
}
.status.error { color: #ef4444; }
.status.loading { color: #f59e0b; }
.spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(0,180,216,0.2);
    border-top-color: #00b4d8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 6px;
    vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
.log {
    background: rgba(0,0,0,0.5);
    border-radius: 10px;
    padding: 12px;
    max-height: 300px;
    overflow-y: auto;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    line-height: 1.6;
    margin-top: 12px;
    display: none;
}
.log.show { display: block; }
.log-item { padding: 2px 0; }
.log-item.ok { color: #22c55e; }
.log-item.err { color: #ef4444; }
.log-item.info { color: #00b4d8; }
.log-item.warn { color: #f59e0b; }
.progress-bar {
    width: 100%;
    height: 6px;
    background: rgba(0,0,0,0.5);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 12px;
    display: none;
}
.progress-bar.show { display: block; }
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #00b4d8, #a855f7);
    width: 0%;
    transition: width 0.3s;
}
</style>
</head>
<body>

<div class="container">
    <h1>🕵️ CLONE WEB PRO</h1>
    <div class="subtitle">Vượt rào cản - Lấy HTML sau khi Render JS</div>

    <div class="card">
        <div class="label">📎 NHẬP URL WEB CẦN LẤY</div>
        <input type="text" id="url-input" placeholder="https://shopee.vn hoặc web bảo mật..." />
        <button class="main-btn" id="clone-btn">🚀 BẮT ĐẦU CLONE</button>
    </div>

    <div class="status" id="status">Sẵn sàng</div>
    <div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="log" id="log"></div>
    
    <button class="main-btn" id="download-html-btn" style="display:none; margin-top:12px; background: linear-gradient(135deg, #22c55e, #16a34a);">📥 TẢI HTML RENDERED</button>
    <button class="main-btn" id="download-zip-btn" style="display:none; margin-top:12px;">📦 TẢI FULL ZIP (NẾU CÓ)</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function() {
    'use strict';

    var $ = function(id) { return document.getElementById(id); };
    var currentHtml = '';
    var currentUrl = '';
    var zip = null;

    function setStatus(text, type) {
        var el = $('status');
        el.innerHTML = type === 'loading' ? '<span class="spinner"></span>' + text : text;
        el.className = 'status' + (type ? ' ' + type : '');
    }

    function addLog(text, type) {
        var log = $('log');
        log.classList.add('show');
        var item = document.createElement('div');
        item.className = 'log-item ' + (type || 'info');
        item.textContent = text;
        log.appendChild(item);
        log.scrollTop = log.scrollHeight;
    }

    function setProgress(p) {
        $('progress-bar').classList.add('show');
        $('progress-fill').style.width = p + '%';
    }

    // Kỹ thuật 1: Dùng Microlink API lấy code sau khi Render JS
    async function fetchViaMicrolink(url) {
        addLog('📡 Đang gọi Microlink (Render JS)...', 'info');
        var api = 'https://api.microlink.io/?url=' + encodeURIComponent(url) + '&meta=false&data.html.selector=body&data.html.type=text';
        try {
            var res = await fetch(api);
            var json = await res.json();
            if (json.status === 'success' && json.data && json.data.html) {
                return json.data.html;
            }
        } catch (e) {
            addLog('Microlink lỗi: ' + e.message, 'warn');
        }
        return null;
    }

    // Kỹ thuật 2: Dùng Jina AI Reader (Vượt Cloudflare, trả về Text/Markdown)
    async function fetchViaJina(url) {
        addLog('📡 Đang gọi Jina AI Reader...', 'info');
        var api = 'https://r.jina.ai/' + url;
        try {
            var res = await fetch(api);
            var text = await res.text();
            if (text && text.length > 100) {
                return text;
            }
        } catch (e) {
            addLog('Jina lỗi: ' + e.message, 'warn');
        }
        return null;
    }

    // Kỹ thuật 3: Dùng Codetabs Proxy (Render cơ bản)
    async function fetchViaCodetabs(url) {
        addLog('📡 Đang gọi Codetabs Proxy...', 'info');
        var api = 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url);
        try {
            var res = await fetch(api);
            var text = await res.text();
            if (text && text.length > 100) {
                return text;
            }
        } catch (e) {
            addLog('Codetabs lỗi: ' + e.message, 'warn');
        }
        return null;
    }

    $('clone-btn').onclick = async function() {
        var url = $('url-input').value.trim();
        if (!url) { setStatus('❌ Chưa nhập URL!', 'error'); return; }
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

        currentUrl = url;
        $('clone-btn').disabled = true;
        $('download-html-btn').style.display = 'none';
        $('download-zip-btn').style.display = 'none';
        $('log').innerHTML = '';
        setStatus('⏳ Đang xử lý...', 'loading');
        setProgress(10);

        try {
            // Thử Microlink trước
            setProgress(30);
            var html = await fetchViaMicrolink(url);

            // Nếu Microlink fail, thử Jina
            if (!html) {
                setProgress(50);
                html = await fetchViaJina(url);
            }

            // Nếu Jina fail, thử Codetabs
            if (!html) {
                setProgress(70);
                html = await fetchViaCodetabs(url);
            }

            if (!html) {
                throw new Error('Cả 3 kỹ thuật đều bị chặn. Web này bảo mật quá cao!');
            }

            currentHtml = html;
            setProgress(100);
            addLog('✅ Lấy thành công! Kích thước: ' + Math.round(html.length / 1024) + 'KB', 'ok');
            setStatus('✅ Đã lấy được Source Code!', 'success');

            // Hiển thị nút tải
            $('download-html-btn').style.display = 'block';

        } catch (err) {
            addLog('❌ Thất bại: ' + err.message, 'err');
            setStatus('❌ ' + err.message, 'error');
        } finally {
            $('clone-btn').disabled = false;
        }
    };

    $('download-html-btn').onclick = function() {
        if (!currentHtml) return;
        var blob = new Blob([currentHtml], { type: 'text/html;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'source_' + new URL(currentUrl).hostname + '.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
        setStatus('✅ Đã tải file HTML!', 'success');
    };

})();
</script>

</body>
</html>
