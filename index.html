<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
    <title>SHOP CAO MINH DUY V80</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root{--bg:#0b0b12;--cyan:#00f2ff;--gold:#ffcc00;--card:#1a1a2e;--red:#ff4444;--vip:#ff00ff}body{background:var(--bg);color:#fff;font-family:sans-serif;padding:10px;margin:0}.box{background:var(--card);padding:15px;border-radius:12px;border:1px solid #2a2a40;margin-bottom:15px;position:relative}input,textarea{width:100%;padding:12px;margin:5px 0;border-radius:8px;border:1px solid #333;background:#000;color:#fff;box-sizing:border-box;outline:0}button{border:none;padding:12px;border-radius:8px;font-weight:800;cursor:pointer;width:100%;transition:.2s;text-transform:uppercase}button:active{transform:scale(.95)}.btn-main{background:var(--cyan);color:#000}.btn-gold{background:var(--gold);color:#000}.btn-red{background:var(--red);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.adm-sec{border:2px solid var(--red);padding:10px;border-radius:12px;margin-bottom:15px;display:none}#qr-display{text-align:center;margin-top:15px;display:none;background:#fff;padding:15px;border-radius:15px;border:3px solid var(--cyan);animation:fade .5s}@keyframes fade{from{opacity:0}to{opacity:1}}#qr-code-shop{display:flex;justify-content:center;margin-bottom:10px}#qr-code-shop img{border-radius:5px;border:1px solid #eee;width:220px;height:220px}#qr-display p{color:#000;margin:2px 0;font-size:13px}table{width:100%;font-size:11px;border-collapse:collapse;margin-top:5px}td,th{padding:8px 4px;border-bottom:1px solid #222;text-align:left}.tag-vip{color:var(--vip);font-weight:700;text-shadow:0 0 5px var(--vip)}.price-tag{display:block;font-size:10px;opacity:.8;margin-top:2px}.scroll-list{max-height:150px;overflow-y:auto;margin-top:10px;background:rgba(0,0,0,.2);padding:5px;border-radius:5px}.del-btn{background:#444;color:#fff;padding:4px 6px;font-size:9px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center}.adm-btn-group{display:flex;gap:5px;margin-top:5px}.btn-small{padding:4px 10px;font-size:10px;width:auto}
    </style>
</head>
<body>

<div id="auth-ui" style="max-width:400px;margin:50px auto;padding:10px">
    <div class="box">
        <h3 style="text-align:center;color:var(--cyan);margin:0 0 15px 0">HỆ THỐNG SHOP V80</h3>
        <input type="text" id="au" placeholder="Tài khoản">
        <input type="password" id="ap" placeholder="Mật khẩu">
        <div class="grid"><button class="btn-main" onclick="auth('login')">ĐĂNG NHẬP</button><button style="background:#444;color:#fff" onclick="auth('reg')">ĐĂNG KÝ</button></div>
    </div>
</div>

<div id="shop-ui" style="display:none;max-width:500px;margin:auto;padding:10px">
    <div id="adm-box" class="adm-sec">
        <h4 style="color:var(--red);text-align:center;margin:0 0 10px 0">QUẢN TRỊ SHOP</h4>
        <div class="grid" style="grid-template-columns:repeat(4,1fr)"><input type="number" id="adm-p-ngay" placeholder="Giá N"><input type="number" id="adm-p-tuan" placeholder="Giá T"><input type="number" id="adm-p-thang" placeholder="Giá Th"><input type="number" id="adm-p-nam" placeholder="Giá Nam"></div>
        <div class="grid" style="grid-template-columns:repeat(4,1fr)"><input type="number" id="adm-v-ngay" placeholder="Vip N"><input type="number" id="adm-v-tuan" placeholder="Vip T"><input type="number" id="adm-v-thang" placeholder="Vip Th"><input type="number" id="adm-v-nam" placeholder="Vip Nam"></div>
        <div class="grid"><input type="number" id="adm-p-roll" placeholder="Giá Quay"><input type="number" id="adm-v-roll" placeholder="Quay VIP"><input type="number" id="adm-rate" placeholder="% Trúng"></div>
        <button class="btn-main" onclick="saveSettings()">LƯU THÔNG SỐ</button>
        <textarea id="add-k" placeholder="Dán key..." style="margin-top:10px;height:50px"></textarea>
        <div class="grid" style="grid-template-columns:repeat(4,1fr)"><button class="btn-main" onclick="upK('ngay')">+N</button><button class="btn-main" onclick="upK('tuan')">+T</button><button class="btn-main" onclick="upK('thang')">+Th</button><button class="btn-main" onclick="upK('nam')">+Nam</button></div>
        <h5>DUYỆT NẠP:</h5><div id="adm-pay-list" class="scroll-list"></div>
        <h5 style="color:var(--cyan)">DUYỆT RESET KEY:</h5><div id="adm-rs-list" class="scroll-list"></div>
        <h5>DANH SÁCH USER:</h5><div class="scroll-list"><table id="adm-user-list"></table></div>
    </div>

    <div class="box">
        <p>Sếp: <b id="u-id" style="color:var(--cyan)"></b> <span id="u-rank" class="tag-vip"></span> | Ví: <b id="u-bl" style="color:var(--gold)">0</b>đ</p>
        <input type="number" id="n-amt" placeholder="Số tiền nạp...">
        <button class="btn-gold" onclick="nap()">NẠP TIỀN QUA QR</button>
        <div id="qr-display">
            <div id="qr-code-shop"></div>
            <p style="font-weight:bold;color:#ff4444" id="qr-info-amt"></p>
            <p id="qr-info-msg"></p>
            <p style="font-size:11px;color:#666;margin-top:5px">Hệ thống tự động duyệt sau khi nhận đủ tiền</p>
        </div>
    </div>

    <div class="box">
        <h4 style="color:var(--cyan);margin:0 0 10px 0">YÊU CẦU ĐỔI MÁY CHỦ (RESET KEY)</h4>
        <input type="text" id="rs-key-input" placeholder="Nhập Key cần đổi máy chủ...">
        <button class="btn-main" onclick="requestResetKey()">GỬI YÊU CẦU ĐỔI MÁY CHỦ</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://shop-v80-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let curUser = null;
    let isAdmin = false;

    function auth(type) {
        let u = document.getElementById("au").value.trim();
        let p = document.getElementById("ap").value.trim();
        if(!u || !p) return Swal.fire("Lỗi", "Vui lòng nhập đủ thông tin", "error");
        
        if(type === 'login') {
            db.ref("users/" + u).once("value", s => {
                if(s.exists() && s.val().p === p) {
                    curUser = u;
                    isAdmin = s.val().role === "admin";
                    document.getElementById("auth-ui").style.display = "none";
                    document.getElementById("shop-ui").style.display = "block";
                    initShop();
                } else {
                    Swal.fire("Lỗi", "Sai tài khoản hoặc mật khẩu", "error");
                }
            });
        } else {
            db.ref("users/" + u).once("value", s => {
                if(s.exists()) return Swal.fire("Lỗi", "Tài khoản đã tồn tại", "error");
                db.ref("users/" + u).set({ p: p, bl: 0, rank: "Thành Viên", role: "user" }, err => {
                    if(!err) Swal.fire("Thành công", "Đăng ký thành công", "success");
                });
            });
        }
    }

    function initShop() {
        document.getElementById("u-id").innerText = curUser;
        db.ref("users/" + curUser).on("value", s => {
            if(s.exists()) {
                document.getElementById("u-bl").innerText = s.val().bl.toLocaleString();
                document.getElementById("u-rank").innerText = s.val().rank || "Thành Viên";
            }
        });

        if(isAdmin) {
            document.getElementById("adm-box").style.display = "block";
            loadAdminData();
        }
    }

    function requestResetKey() {
        let key = document.getElementById("rs-key-input").value.trim();
        if(!key) return Swal.fire("Lỗi", "Vui lòng nhập Key cần đổi máy chủ", "error");
        
        db.ref("reset_requests").push({
            user: curUser,
            key: key,
            status: "pending",
            time: Date.now()
        }, err => {
            if(!err) {
                Swal.fire("Thành công", "Đã gửi yêu cầu đổi máy chủ. Vui lòng đợi Admin duyệt!", "success");
                document.getElementById("rs-key-input").value = "";
            }
        });
    }

    function loadAdminData() {
        db.ref("settings").on("value", s => {
            if(s.exists()) {
                let v = s.val();
                document.getElementById("adm-p-ngay").value = v.p_ngay || 0;
                document.getElementById("adm-p-tuan").value = v.p_tuan || 0;
                document.getElementById("adm-p-thang").value = v.p_thang || 0;
                document.getElementById("adm-p-nam").value = v.p_nam || 0;
                document.getElementById("adm-v-ngay").value = v.v_ngay || 0;
                document.getElementById("adm-v-tuan").value = v.v_tuan || 0;
                document.getElementById("adm-v-thang").value = v.v_thang || 0;
                document.getElementById("adm-v-nam").value = v.v_nam || 0;
                document.getElementById("adm-p-roll").value = v.p_roll || 0;
                document.getElementById("adm-v-roll").value = v.v_roll || 0;
                document.getElementById("adm-rate").value = v.rate || 0;
            }
        });

        db.ref("payments").on("value", s => {
            let html = "";
            s.forEach(child => {
                let p = child.val();
                if(p.status === "pending") {
                    html += `<div style="margin-bottom:5px;border-bottom:1px solid #333;padding-bottom:3px">
                        ${p.user} - ${parseInt(p.amt).toLocaleString()}đ <br>
                        <button class="btn-main btn-small" onclick="approvePay('${child.key}', '${p.user}', ${p.amt})">Duyệt</button>
                        <button class="btn-red btn-small" onclick="rejectPay('${child.key}')">Xóa</button>
                    </div>`;
                }
            });
            document.getElementById("adm-pay-list").innerHTML = html || "Không có yêu cầu nạp";
        });

        db.ref("reset_requests").on("value", s => {
            let html = "";
            s.forEach(child => {
                let r = child.val();
                if(r.status === "pending") {
                    html += `<div style="margin-bottom:5px;border-bottom:1px solid #333;padding-bottom:3px">
                        Sếp: <b>${r.user}</b> <br> Key: <span style="color:var(--cyan)">${r.key}</span> <br>
                        <div class="adm-btn-group">
                            <button class="btn-main btn-small" onclick="approveReset('${child.key}', '${r.key}')">Duyệt Đổi</button>
                            <button class="btn-red btn-small" onclick="rejectReset('${child.key}')">Từ Chối</button>
                        </div>
                    </div>`;
                }
            });
            document.getElementById("adm-rs-list").innerHTML = html || "Không có yêu cầu đổi máy chủ";
        });

        db.ref("users").on("value", s => {
            let html = "<tr><th>User</th><th>Ví</th><th>Rank</th><th>Hành động</th></tr>";
            s.forEach(child => {
                let u = child.val();
                html += `<tr>
                    <td>${child.key}</td>
                    <td>${u.bl.toLocaleString()}đ</td>
                    <td>${u.rank || "Thành Viên"}</td>
                    <td>
                        <button class="del-btn" onclick="editUser('${child.key}', ${u.bl})">Sửa</button>
                    </td>
                </tr>`;
            });
            document.getElementById("adm-user-list").innerHTML = html;
        });
    }

    function saveSettings() {
        db.ref("settings").set({
            p_ngay: document.getElementById("adm-p-ngay").value,
            p_tuan: document.getElementById("adm-p-tuan").value,
            p_thang: document.getElementById("adm-p-thang").value,
            p_nam: document.getElementById("adm-p-nam").value,
            v_ngay: document.getElementById("adm-v-ngay").value,
            v_tuan: document.getElementById("adm-v-tuan").value,
            v_thang: document.getElementById("adm-v-thang").value,
            v_nam: document.getElementById("adm-v-nam").value,
            p_roll: document.getElementById("adm-p-roll").value,
            v_roll: document.getElementById("adm-v-roll").value,
            rate: document.getElementById("adm-rate").value
        }, err => {
            if(!err) Swal.fire("Thành công", "Đã lưu thông số shop", "success");
        });
    }

    function upK(type) {
        let txt = document.getElementById("add-k").value.trim();
        if(!txt) return Swal.fire("Lỗi", "Nhập danh sách key", "error");
        let arr = txt.split("\n").map(x => x.trim()).filter(x => x);
        arr.forEach(k => {
            db.ref("keys/" + type + "/" + k).set({ status: "live" });
        });
        Swal.fire("Thành công", `Đã thêm ${arr.length} key loại ${type}`, "success");
        document.getElementById("add-k").value = "";
    }

    function approvePay(key, user, amt) {
        db.ref("users/" + user + "/bl").transaction(cb => (cb || 0) + parseInt(amt), () => {
            db.ref("payments/" + key).update({ status: "success" });
        });
    }
    function rejectPay(key) { db.ref("payments/" + key).remove(); }

    function approveReset(reqKey, gameKey) {
        db.ref("game_keys/" + gameKey).once("value", s => {
            if(s.exists()) {
                db.ref("game_keys/" + gameKey).update({ hwid: "null", device_id: "null", status: "live" }, err => {
                    if(!err) {
                        db.ref("reset_requests/" + reqKey).update({ status: "approved" });
                        Swal.fire("Thành công", "Đã reset máy chủ thành công cho key này", "success");
                    }
                });
            } else {
                db.ref("reset_requests/" + reqKey).update({ status: "failed_key_not_found" });
                Swal.fire("Thành công", "Đã duyệt nhưng không tìm thấy key trong danh sách hệ thống game", "warning");
            }
        });
    }
    function rejectReset(key) { db.ref("reset_requests/" + key).remove(); }

    function editUser(u, cBl) {
        Swal.fire({
            title: "Sửa ví cho " + u,
            input: "number",
            inputValue: cBl,
            showCancelButton: true
        }).then(res => {
            if(res.isConfirmed && res.value) {
                db.ref("users/" + u).update({ bl: parseInt(res.value) });
            }
        });
    }

    function nap() {
        let amt = document.getElementById("n-amt").value;
        if(!amt || amt < 1000) {
            Swal.fire("Lỗi", "Số tiền nạp tối thiểu là 1.000đ", "error");
            return;
        }
        let msg = "NAP " + curUser;
        
        document.getElementById("qr-info-amt").innerText = "Số tiền: " + parseInt(amt).toLocaleString() + " đ";
        document.getElementById("qr-info-msg").innerText = "Nội dung: " + msg;
        document.getElementById("qr-display").style.display = "block";
        
        let qrDiv = document.getElementById("qr-code-shop");
        qrDiv.innerHTML = "";
        
        let baseQR = "00020101021238580010A0000007270126000697042201121010385458310208TRANHO8853037045405150005802VN5913TRAN MINH HOA6009Ha Noi VN62340520Do tieu dung gia dinh0806TRANHO6304CC68";
        let apiUrl = `https://api.vietqr.io/image/970422-101038545831-TRANHO88.jpg?amt=${amt}&add=${encodeURIComponent(msg)}&accountName=TRAN%20MINH%20HOA`;
        
        new QRCode(qrDiv, {
            text: baseQR,
            width: 220,
            height: 220
        });
        
        setTimeout(() => {
            let qrImg = qrDiv.querySelector("img");
            if (qrImg) qrImg.src = apiUrl;
        }, 50);

        db.ref("payments").push({
            user: curUser,
            amt: parseInt(amt),
            status: "pending",
            time: Date.now()
        });
    }
</script>

</body>
</html>
